<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Smart Calculator</title>

<style>
/* =====================================================
   THEME
===================================================== */

:root {
    --bg: #ffffff;
    --card: #ffffff;
    --text: #252525;
    --muted: #888888;
    --line: #e8e8e8;
    --key: #f6f6f6;
    --accent: #ff7138;
    --accent-light: #fff0e9;
    --danger: #ffe9e5;
}

body.dark {
    --bg: #111214;
    --card: #191a1e;
    --text: #ffffff;
    --muted: #9b9b9b;
    --line: #33353a;
    --key: #26282d;
    --accent-light: #3b241c;
    --danger: #3b211d;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 620px;
    min-height: 100vh;
    margin: auto;
    background: var(--card);
    padding-bottom: 75px;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
}

.logo {
    font-size: 19px;
    font-weight: bold;
}

.logo span {
    color: var(--accent);
}

.icon-button {
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 25px;
    border-radius: 50%;
}


/* =====================================================
   PAGES
===================================================== */

.page {
    padding: 18px;
}

.page-title {
    text-align: center;
    font-size: 22px;
    margin-bottom: 22px;
}

.back {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.back button {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 30px;
}

.back h2 {
    font-size: 21px;
}


/* =====================================================
   BASIC CALCULATOR
===================================================== */

.calculator {
    padding: 0 16px 20px;
}

.display {
    min-height: 205px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 20px 5px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
}

.expression {
    color: var(--muted);
    font-size: 20px;
    min-height: 28px;
    word-break: break-all;
}

.result {
    font-size: 54px;
    line-height: 1.15;
    word-break: break-all;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding-top: 15px;
}

.key {
    height: 68px;
    border: none;
    border-radius: 18px;
    background: var(--key);
    color: var(--text);
    font-size: 23px;
}

.key:active {
    transform: scale(.96);
}

.key.operator {
    color: var(--accent);
    font-size: 27px;
}

.key.ac {
    background: var(--accent-light);
    color: var(--accent);
}

.key.equal {
    background: var(--accent);
    color: white;
}

.key.zero {
    grid-column: span 2;
}


/* =====================================================
   SCIENTIFIC
===================================================== */

.scientific {
    padding: 10px 12px;
}

.scientific-display {
    min-height: 145px;
}

.scientific-mode {
    display: flex;
    gap: 20px;
    padding: 8px;
    font-size: 12px;
    font-weight: bold;
    color: var(--muted);
}

.scientific-mode .active {
    color: var(--accent);
}

.scientific-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
}

.scientific-grid .key {
    height: 53px;
    border-radius: 12px;
    font-size: 15px;
}

.scientific-info {
    color: var(--muted);
    font-size: 12px;
    margin-top: 15px;
    line-height: 1.5;
}


/* =====================================================
   SECTION GRID
===================================================== */

.section-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.section-card {
    min-height: 105px;
    border: 1px solid var(--line);
    border-radius: 17px;
    background: var(--card);
    color: var(--text);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 9px;
    box-shadow: 0 3px 12px rgba(0,0,0,.04);
}

.section-card:active {
    transform: scale(.97);
}

.section-icon {
    font-size: 28px;
}

.section-name {
    font-size: 13px;
    color: var(--muted);
}


/* =====================================================
   FORMS
===================================================== */

.card {
    border: 1px solid var(--line);
    border-radius: 17px;
    padding: 18px;
    margin-bottom: 15px;
}

.card h3 {
    margin-bottom: 18px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 15px;
}

.field label {
    font-size: 13px;
    color: var(--muted);
    font-weight: bold;
}

.field input,
.field select {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
}

.primary-button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    background: var(--accent);
    color: white;
    font-weight: bold;
    font-size: 15px;
}

.output {
    margin-top: 15px;
    padding: 17px;
    border-radius: 12px;
    background: var(--accent-light);
    color: var(--accent);
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.swap {
    display: block;
    width: 42px;
    height: 42px;
    margin: 5px auto 15px;
    border: none;
    border-radius: 50%;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 20px;
}


/* =====================================================
   HISTORY
===================================================== */

.history-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px;
    margin-top: 9px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.history-expression {
    color: var(--muted);
    font-size: 13px;
}

.history-result {
    font-weight: bold;
    margin-top: 4px;
}

.clear-history {
    border: none;
    background: var(--danger);
    color: var(--accent);
    border-radius: 9px;
    padding: 10px 14px;
    font-weight: bold;
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(620px, 100%);
    height: 70px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--card);
    border-top: 1px solid var(--line);
    z-index: 20;
}

.nav-button {
    border: none;
    background: transparent;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3px;
}

.nav-button span {
    font-size: 22px;
}

.nav-button small {
    font-size: 11px;
}

.nav-button.active {
    color: var(--accent);
}


/* =====================================================
   DRAWER
===================================================== */

.drawer {
    position: fixed;
    z-index: 100;
    left: 0;
    top: 0;
    width: 290px;
    height: 100vh;
    background: var(--card);
    padding: 20px;
    transform: translateX(-110%);
    transition: .25s;
    box-shadow: 10px 0 30px rgba(0,0,0,.2);
}

.drawer.open {
    transform: translateX(0);
}

.drawer-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.drawer-link {
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    color: var(--text);
    padding: 15px 8px;
    font-weight: bold;
    border-radius: 9px;
}

.drawer-link:hover {
    background: var(--key);
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 90;
    display: none;
}

.overlay.show {
    display: block;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px) {

    .section-grid {
        gap: 9px;
    }

    .section-card {
        min-height: 95px;
    }

    .section-icon {
        font-size: 24px;
    }

    .section-name {
        font-size: 12px;
    }

    .key {
        height: 63px;
    }

    .result {
        font-size: 45px;
    }

    .scientific-grid .key {
        height: 49px;
        font-size: 13px;
    }
}
</style>

<script>

/* =====================================================
   HISTORY
===================================================== */

let history =
    JSON.parse(
        localStorage.getItem("calculatorHistory")
    ) || [];

function addHistory(type, expression, result) {

    history.unshift({
        type,
        expression,
        result,
        time: new Date().toLocaleString()
    });

    history =
        history.slice(0, 100);

    localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
    );
}


/* =====================================================
   BASIC CALCULATOR
===================================================== */

let expression = "";
let answer = "0";
let previous = "";

function evaluateExpression(value) {

    value = value
        .replaceAll("×", "*")
        .replaceAll("÷", "/")
        .replaceAll("−", "-");

    if (
        !/^[0-9+\-*/%.()\s]+$/.test(value)
    ) {
        throw new Error();
    }

    const result =
        Function(
            `"use strict"; return (${value})`
        )();

    if (!Number.isFinite(result)) {
        throw new Error();
    }

    return Number(
        result.toFixed(12)
    ).toString();
}


function basicKey(key) {

    if (key === "AC") {

        expression = "";
        answer = "0";
        previous = "";

    }

    else if (key === "DEL") {

        expression =
            expression.slice(0, -1);

        answer =
            expression || "0";

    }

    else if (key === "=") {

        if (!expression) return;

        try {

            const oldExpression =
                expression;

            const result =
                evaluateExpression(
                    expression
                );

            previous =
                oldExpression + " =";

            answer = result;

            expression = result;

            addHistory(
                "Basic",
                oldExpression,
                result
            );

        }

        catch {

            previous =
                "Invalid calculation";

            answer = "Error";

        }

    }

    else {

        expression += key;

        answer = expression;

    }

    renderCalculator();
}


/* =====================================================
   BASIC CALCULATOR SCREEN
===================================================== */

function renderCalculator() {

    document.getElementById("app")
        .innerHTML = `

        <section class="calculator">

            <div class="display">

                <div class="expression">
                    ${previous}
                </div>

                <div class="result">

            <div class="keypad">

                <button class="key ac"
                    onclick="basicKey('AC')">

                </button>

                    onclick="basicKey('DEL')">

                </button>

                <button class="key operator"
                    onclick="basicKey('%')">
                    %
                </button>

                <button class="key operator"
                    onclick="basicKey('÷')">
                    ÷
                </button>


                <button class="key"
                    onclick="basicKey('7')">
                    7
                </button>

                <button class="key"
                    onclick="basicKey('8')">
                    8
                </button>

                <button class="key"
                    onclick="basicKey('9')">
                    9
                </button>

                <button class="key operator"
                    onclick="basicKey('×')">
                    ×
                </button>


                <button class="key"
                    onclick="basicKey('4')">
                    4
                </button>

                <button class="key"
                    onclick="basicKey('5')">
                    5
                </button>

                <button class="key"
                    onclick="basicKey('6')">
                    6
                </button>

                <button class="key operator"
                    onclick="basicKey('−')">
                    −
                </button>


                <button class="key"
                    onclick="basicKey('1')">
                    1
                </button>

                <button class="key"
                    onclick="basicKey('2')">
                    2
                </button>

                <button class="key"
                    onclick="basicKey('3')">
                    3
                </button>

                <button class="key operator"
                    onclick="basicKey('+')">
                    +
                </button>


                <button class="key zero"
                    onclick="basicKey('0')">
                    0
                </button>

                <button class="key"
                    onclick="basicKey('.')">
                    .
                </button>

                <button class="key equal"
                    onclick="basicKey('=')">
                    =
                </button>

            </div>

        </section>
    `;
}


/* =====================================================
   SCIENTIFIC CALCULATOR
===================================================== */

let sciExpression = "";
let sciAnswer = "0";
let sciPrevious = "";


function scientificEvaluate(value) {

    value = value
        .replaceAll("π", "Math.PI")
        .replace(/\be\b/g, "Math.E")
        .replace(/sin\(/g, "Math.sin(")
        .replace(/cos\(/g, "Math.cos(")
        .replace(/tan\(/g, "Math.tan(")
        .replace(/sqrt\(/g, "Math.sqrt(")
        .replace(/log\(/g, "Math.log10(")
        .replace(/ln\(/g, "Math.log(")
        .replaceAll("^", "**");

    if (
        !/^[0-9+\-*/%().\sA-Za-z]+$/.test(value)
    ) {
        throw new Error();
    }

    const result =
        Function(
            `"use strict"; return (${value})`
        )();

    if (!Number.isFinite(result)) {
        throw new Error();
    }

    return Number(
        result.toFixed(12)
    ).toString();
}


function scientificKey(key) {

    if (key === "AC") {

        sciExpression = "";
        sciAnswer = "0";
        sciPrevious = "";

    }

    else if (key === "DEL") {

        sciExpression =
            sciExpression.slice(0, -1);

        sciAnswer =
            sciExpression || "0";

    }

    else if (key === "=") {

        try {

            const old =
                sciExpression;

            const result =
                scientificEvaluate(
                    sciExpression
                );

            sciPrevious =
                old + " =";

            sciAnswer = result;
            sciExpression = result;

            addHistory(
                "Scientific",
                old,
                result
            );

        }

        catch {

            sciPrevious =
                "Invalid calculation";

            sciAnswer = "Error";

        }

    }

    else if (key === "sin" ||
             key === "cos" ||
             key === "tan" ||
             key === "sqrt" ||
             key === "log" ||
             key === "ln") {

        sciExpression +=
            key + "(";

        sciAnswer =
            sciExpression;

    }

    else if (key === "x²") {

        sciExpression += "^2";

        sciAnswer =
            sciExpression;

    }

    else if (key === "1/x") {

        sciExpression =
            `1/(${sciExpression || 1})`;

        sciAnswer =
            sciExpression;

    }

    else {

        sciExpression += key;

        sciAnswer =
            sciExpression;

    }

    renderScientific();
}


function renderScientific() {

    document.getElementById("app")
        .innerHTML = `

        <section class="scientific">

            <div class="back">

                <button
                    onclick="showPage('calculator')">
                    ‹
                </button>

                <h2>Scientific</h2>

            </div>


            <div class="scientific-mode">

                <span class="active">
                    NORM
                </span>

                <span>
                    MATH
                </span>

                <span>
                    DEG
                </span>

            </div>


            <div class="display scientific-display">

                <div class="expression">
                    ${sciPrevious}
                </div>

                <div class="result">
                    ${sciAnswer}
                </div>

            </div>


            <div class="scientific-grid">

                ${[
                    "AC","DEL","(",")","÷",
                    "sin","cos","tan","sqrt","×",
                    "log","ln","x²","^","−",
                    "7","8","9","%","+",
                    "4","5","6",".","=",
                    "1","2","3","π","e",
                    "0","1/x"
                ].map(key => `

                    <button
                        class="key ${
                            ["÷","×","−","+"]
                            .includes(key)
                            ? "operator"
                            : ""
                        } ${
                            key === "AC"
                            ? "ac"
                            : ""
                        } ${
                            key === "="
                            ? "equal"
                            : ""
                        }"
                        onclick="scientificKey('${key}')">

                        ${key}

                    </button>

                `).join("")}

            </div>


            <p class="scientific-info">

                Trigonometric functions currently use
                degree values. Example: sin(30) = 0.5.

            </p>

        </section>
    `;
}

/* =====================================================
   UNIT CONVERTER
===================================================== */

function renderUnitConverter(type) {

    const data =
        units[type];

    const names =
        Object.keys(data.values);

    document.getElementById("app")
        .innerHTML = `

        <section class="page">

            <div class="back">

                <button
                    onclick="showPage('converter')">
                    ‹
                </button>

function swapUnits() {

    const from =
        document.getElementById(
            "fromUnit"
        );

    const to =
        document.getElementById(
            "toUnit"
        );

    const temp =
        from.value;

    from.value =
        to.value;

    to.value =
        temp;
}


function convertUnit(type) {

    const value =
        Number(
            document.getElementById(
                "unitValue"
            ).value
        );

    const from =
        document.getElementById(
            "fromUnit"
        ).value;

    const to =
        document.getElementById(
            "toUnit"
        ).value;

    if (Number.isNaN(value)) {

        document.getElementById(
            "unitOutput"
        ).textContent =
            "Enter a valid number";

        return;

    }

    const data =
        units[type].values;

    const base =
        value * data[from];

    const result =
        base / data[to];

    document.getElementById(
        "unitOutput"
    ).textContent =

        `${value} ${from} = ${
            Number(result.toFixed(8))
        } ${to}`;

}

                        type="date">

                    class="primary-button"
                    onclick="calculateAge()">

                    Calculate Age

                <div
                    class="output"
                    id="ageOutput">

                    Select your date of birth

                </div>

            </div>

        </section>
    `;
}


function calculateAge() {

    const birth =
        new Date(
            document.getElementById(
                "birthDate"
            ).value
        );

    const today =
        new Date();

    if (
        Number.isNaN(
            birth.getTime()
        )
    ) return;

    let years =
        today.getFullYear() -
        birth.getFullYear();

    let months =
        today.getMonth() -
        birth.getMonth();

    let days =
        today.getDate() -
        birth.getDate();

    if (days < 0) {

        months--;

        days +=
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            ).getDate();

    }

    if (months < 0) {

        years--;
        months += 12;

    }

    document.getElementById(
        "ageOutput"
    ).textContent =

        `${years} years, ${months} months, ${days} days`;
}
